evaluation:
  id: linear_probe_immunocto_encoder_gigatime
  task: single_cell_classification
  dataset: linear_probe_features
  head: linear_probe
data:
  feature_experiment_config: configs/experiments/linear_probe_immunocto_gigatime_20x_s32.yaml
  feature_layer: x4_0
  train_split: train
  valid_split: valid
  test_split: test
  # Official split (immunocto_patient_split.csv): test = CRC02/11/19/30.
  # Surplus-other exclusions are frozen to each split's cd4 count (seed 42).
head: {}
training:
  seed: 42
  device: cuda
  batch_size: 16384
  eval_batch_size: 262144
  max_epochs: 50
  evaluate_test: true
  feature_normalize: zscore_train
  combine_trainval: false
  weighted_sample: false
  primary_metric: macro_f1
  primary_metric_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 0.0
  early_stopping_start_epoch: 0
  optimizer:
    name: AdamW
    params:
      lr: 0.001
      weight_decay: 0.001
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 50
      eta_min: 0.0
  verbose: false
  evaluate_test_each_epoch: false
  torch_num_threads: 6
  checkpoint_select_metric: valid_macro_f1
metrics: {}
survival: {}
run:
  output_dir: ../results/single_cell_cls/immunocto/encoder_layer/gigatime
