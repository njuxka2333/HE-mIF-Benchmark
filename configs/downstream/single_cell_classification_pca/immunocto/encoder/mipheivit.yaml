evaluation:
  id: linear_probe_immunocto_encoder_mipheivit_pca16
  task: single_cell_classification
  dataset: linear_probe_features
  head: linear_probe
data:
  feature_experiment_config: configs/experiments/linear_probe_immunocto_mipheivit_20x_s32.yaml
  feature_layer: z4
  train_split: train
  valid_split: valid
  test_split: test
head: {}
training:
  seed: 42
  device: cuda
  batch_size: 4096
  eval_batch_size: 131072
  max_epochs: 50
  evaluate_test: true
  feature_normalize: zscore_train
  combine_trainval: false
  weighted_sample: false
  primary_metric: macro_f1
  primary_metric_mode: max
  early_stopping_patience: 0
  early_stopping_min_delta: 0.0
  early_stopping_start_epoch: 0
  optimizer:
    name: AdamW
    params:
      lr: 0.0001
      weight_decay: 0.0001
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 50
      eta_min: 0.0
  verbose: false
  evaluate_test_each_epoch: false
  checkpoint_select_metric: valid_macro_f1
  pca_dim: 16
  pca_max_cells: 50000
metrics: {}
survival: {}
run:
  output_dir: results/scc_pca/single_cell_cls/immunocto/encoder_layer/mipheivit
