evaluation:
  id: linear_probe_immunocto_encoder_rosie
  task: single_cell_classification
  dataset: linear_probe_features
  head: linear_probe
data:
  feature_experiment_config: configs/experiments/linear_probe_immunocto_rosie_40x_s64.yaml
  feature_layer: stage3
  train_split: train
  valid_split: valid
  test_split: test
  # Official split (patient_split.csv): test = CRC02/11/19/30.
  # Surplus-other exclusions are frozen to each split's cd4 count (seed 42).
training:
  seed: 42
  device: cuda
  batch_size: 16384
  eval_batch_size: 262144
  max_epochs: 50
  evaluate_test: true
  feature_normalize: none
  combine_trainval: false
  weighted_sample: false
  primary_metric: macro_f1
  primary_metric_mode: max
  early_stopping_patience: 0
  checkpoint_select_metric: valid_macro_f1
  optimizer:
    name: AdamW
    params:
      lr: 0.1
      weight_decay: 1.0e-05
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 50
      eta_min: 0.0
  evaluate_test_each_epoch: false
  torch_num_threads: 6
run:
  output_dir: ../results/single_cell_cls/immunocto/encoder_layer/rosie
