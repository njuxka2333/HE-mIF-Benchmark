evaluation:
  id: cellseg_lizard_encoder_histoplexer
  task: cell_semantic_segmentation
  dataset: lizard_online
  head: unetr
experiment:
  id: cellseg_lizard_encoder_histoplexer
  head: unetr
  dataset: lizard
  model: histoplexer
  target_mpp: 0.25
  target_patch_size: 1024
  target_features:
  - z3
  - z4
  - z5
  - z6
  pathocell_tiling: pfmb
masks:
  save: false
data:
  train_split: train
  valid_split: valid
  test_split: test
  test_result_name: lizard_test_metrics.csv
  test_batch_size: 2
  online_sampling:
    batch_size: 2
    seed: 42
    volume_cache_size: 4
    prefetch_batches: 1
head:
  feature_layers: null
  decoder_mode: cellseg
  decoder_channels:
  - 128
  - 256
  - 512
  - 512
  dropout: 0.1
training:
  seed: 42
  device: cuda
  training_steps: 20000
  log_interval: 10
  val_interval: 200
  online_valid_protocol: full_grid
  batch_size: 2
  uniform_class_sampling: true
  sample_excluded_classes: false
  amp: true
  skip_test: false
  early_stopping: 1200
  grad_clip_norm: 2.0
  primary_metric: f1_score_macro
  optimizer:
    name: AdamW
    params:
      lr: 3.0e-05
      weight_decay: 0.03
    warmup_steps: 1000
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 20000
      eta_min: 1.0e-06
  loss_fn:
    name: CrossEntropyLoss
    params:
      label_smoothing: 0.05
      reduction: none
    class_weighting: true
    exclude_classes:
    - 0
  augmentations:
    RandomHorizontalFlip:
      p: 0.5
    RandomVerticalFlip:
      p: 0.5
    RandomAffine:
      degrees:
      - 0
      - 360
      translate: 0.1
      scale:
      - 0.8
      - 1.2
      resample: BILINEAR
    RandomElasticTransform:
      kernel_size:
      - 63
      - 63
      sigma:
      - 32.0
      - 32.0
      alpha:
      - 1.0
      - 1.0
    HEDNormalize:
      sigma: 0.025
      bias: 0.05
metrics:
  exclude_background: true
  iou_match_threshold: 0.5
survival: {}
run:
  output_dir: ../Evaluation/cellseg/lizard/encoder/histoplexer
  feat_dir: Pre_Features/lizard_cellseg_online_histoplexer_pathocell_hparams
  feature_storage: patch_h5
  feature_extract_batch_size: null
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.25
  output_layout: prepath_legacy
  grid_stride: 2
  feature_dtype: float16
  mask_dtype: uint8
  input_format: manifest
  wds_root: null
  extraction_mode: grid
  backend: openslide
  cpu_threads: 2
  iterator_cpus: 4
  progress_every: 500
  coords_manifest: null
