evaluation:
  id: cellseg_pathocell_output_rosie
  task: cell_semantic_segmentation
  dataset: pathocell_online
  head: unetr
experiment:
  id: cellseg_pathocell_output_rosie
  head: unetr
  dataset: pathocell
  model: rosie
  target_mpp: 0.5
  target_patch_size: 128
  pathocell_tiling: pfmb
  description: 'Virtual-stain route (MifUNet): online frozen generator → resample
    256 → resnet18-from-scratch. Loss/metrics/data inherited from encoder-route cellseg.'
masks:
  save: false
data:
  train_split: train
  valid_split: valid
  test_split: test
  test_result_name: pathocell_test_metrics.csv
  test_batch_size: 8
  online_sampling:
    batch_size: 8
    seed: 42
    volume_cache_size: 8
    prefetch_batches: 2
  mif_layer: mif0
head:
  decoder_mode: mif_unet
  in_channels: 50
  timm_encoder_name: resnet18
  pretrained: false
  out_indices:
  - 1
  - 2
  - 3
  - 4
  target_size: 256
  channel_proj_dim: null
  drop_rate: 0.1
  decoder_channels:
  - 64
  - 128
  - 256
  - 256
  mif_layer: mif0
training:
  seed: 42
  device: cuda
  training_steps: 2000
  log_interval: 10
  val_interval: 200
  online_valid_protocol: full_grid
  batch_size: 8
  uniform_class_sampling: true
  sample_excluded_classes: false
  amp: true
  skip_test: false
  early_stopping: 6000
  grad_clip_norm: 2.0
  primary_metric: f1_score_macro
  optimizer:
    name: AdamW
    params:
      lr: 3.0e-05
      weight_decay: 0.0001
    warmup_steps: 100
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 2000
      eta_min: 1.0e-06
  loss_fn:
    name: CrossEntropyLoss
    params:
      label_smoothing: 0.05
      reduction: none
    class_weighting: true
    exclude_classes:
    - 0
  augmentations:
    RandomHorizontalFlip:
      p: 0.5
    RandomVerticalFlip:
      p: 0.5
    RandomAffine:
      degrees:
      - 0
      - 360
      translate: 0.1
      scale:
      - 0.8
      - 1.2
      resample: BILINEAR
    RandomElasticTransform:
      kernel_size:
      - 63
      - 63
      sigma:
      - 32.0
      - 32.0
      alpha:
      - 1.0
      - 1.0
  vstain_stage: C
  notes: Stage C shared lr=3e-05 (Stage A mean winner) and steps=2000 (Stage B earliest
    plateau; best val macro-F1 at step 1400).
metrics:
  exclude_background: true
  iou_match_threshold: 0.5
survival: {}
run:
  output_dir: ../Evaluation/cellseg/pathocell/output/rosie
  use_benchmark_config: false
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.5
  cpu_threads: 2
  iterator_cpus: 4
