evaluation:
  id: tls_output_gigatime
  task: tls_region_segmentation
  dataset: hooknet_tls
  head: unetr
experiment:
  id: tls_output_gigatime
  head: unetr
  dataset: hooknet_tls
  model: gigatime
  dense_interface: default
  target_mpp: 0.25
  target_patch_size: 512
  description: 'Virtual-stain route (MifFeatureUNETR): online frozen generator → resample
    512 → resnet18-from-scratch. Loss/metrics/data from encoder-route TLS.'
  pathocell_tiling: pfmb
masks:
  save: true
data:
  train_split: train
  valid_split: valid
  test_split: test
  test_result_name: hooknet_tls_test_metrics.csv
  test_eval_protocol: full_grid
  online_test_steps: 50
  test_sampler_seed_offset: 20000
  mif_layer: mif
  fixed_grid_he_source: canonical_png_pfmb
head:
  decoder_mode: mif_feature
  in_channels: 23
  timm_encoder_name: resnet18
  pretrained: false
  out_indices:
  - 1
  - 2
  - 3
  - 4
  target_size: 512
  channel_proj_dim: null
  dropout: 0.1
  adapter_channels:
  - 64
  - 128
  - 256
  - 256
  use_z0: true
  z0_channels: 64
  mif_layer: mif
training:
  seed: 42
  device: cuda
  training_steps: 2500
  log_interval: 10
  val_interval: 250
  online_valid_steps: 50
  online_valid_protocol: full_grid
  uniform_class_sampling: true
  batch_size: 2
  gradient_accumulation: 2
  amp: true
  online_profile_steps: false
  skip_test: false
  early_stopping: 1500
  grad_clip_norm: 2.0
  primary_metric: f1_macro
  optimizer:
    name: AdamW
    params:
      lr: 0.0001
      weight_decay: 0.0001
    warmup_steps: 125
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 2500
      eta_min: 1.0e-06
  loss_fn:
    name: CrossEntropyLoss
    params:
      label_smoothing: 0.0
      reduction: none
      ignore_index: 255
    class_weighting: true
    exclude_classes:
    - 0
    ema_alpha: 0.95
  augmentations: {}
  vstain_stage: C
  notes: Stage C shared lr=0.0001 (Stage A mean winner) and steps=2500 (Stage B earliest
    plateau). test_eval_protocol=fixed_sampled because the VS trainer consumes FixedGridIndexSampler.next_batch,
    not encoder-route PNG full_grid. PFMB no-overlap tiles on canonical PNG; test_eval_protocol=full_grid.
metrics:
  exclude_background: true
  iou_match_threshold: 0.5
run:
  output_dir: ../Evaluation/tls/output/gigatime
  use_benchmark_config: false
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.25
  extraction_mode: fixed_grid
  cpu_threads: 2
  iterator_cpus: 2
  official_sampling:
    start_epoch: 0
    epochs: 20
    steps: 250
    sampler_batch_size: 8
    seed: 42
    fast: true
    progress_every: 50
    prefetch_batches: 1
    fixed_grid_root: /data3/houjunlin/fxx/datasets/HookNet_TLS_fixed_grid_ps1024
    fixed_grid_patch_weight: uniform
    fixed_grid_sampler_mode: index
    fixed_grid_min_selected_class_pixels: 1
    fixed_grid_max_resample_attempts: 32
