evaluation:
  id: tls_encoder_gigatime
  task: tls_region_segmentation
  dataset: hooknet_tls
  head: unetr
experiment:
  id: tls_encoder_gigatime
  head: unetr
  dataset: hooknet_tls
  model: gigatime
  target_mpp: 0.25
  target_patch_size: 512
  target_features:
  - x0_0
  - x1_0
  - x2_0
  - x3_0
  - x4_0
  pathocell_tiling: pfmb
masks:
  save: true
data:
  train_split: train
  valid_split: valid
  test_split: test
  test_result_name: hooknet_tls_test_metrics.csv
  test_eval_protocol: full_grid
  online_test_steps: 50
  test_sampler_seed_offset: 20000
  test_batch_size: 4
  fixed_grid_he_source: canonical_png_pfmb
head:
  feature_layers: null
  adapter_channels:
  - 32
  - 64
  - 128
  - 256
  - 512
  dropout: 0.15
  decoder_mode: feature
training:
  seed: 42
  device: cuda
  training_steps: 5000
  log_interval: 10
  val_interval: 250
  online_valid_steps: 50
  online_valid_protocol: full_grid
  batch_size: 8
  gradient_accumulation: 2
  amp: true
  online_profile_steps: false
  skip_test: false
  early_stopping: 1000
  grad_clip_norm: 2.0
  primary_metric: f1_macro
  optimizer:
    name: Adam
    params:
      lr: 3.0e-05
      weight_decay: 0.0
    warmup_steps: 100
  scheduler:
    name: CosineAnnealingLR
    params:
      T_max: 5000
      eta_min: 1.0e-06
  loss_fn:
    name: CrossEntropyLoss
    params:
      label_smoothing: 0.0
      reduction: none
      ignore_index: 255
    class_weighting: true
    exclude_classes:
    - 0
    ema_alpha: 0.95
  augmentations: {}
  ignore_index: 255
metrics:
  exclude_background: true
  iou_match_threshold: 0.5
survival: {}
run:
  output_dir: ../Evaluation/tls/encoder/gigatime
  feat_dir: Pre_Features/tls_pfmb_encoder_hpo_v1_gigatime_ps512_official_x0x4_lr3e5_do15_wd0_bs8_ls000_gc2_wu100_hd32x64x128x256x512_s42
  feature_storage: patch_h5
  feature_extract_batch_size: 8
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.25
  output_layout: prepath_legacy
  grid_stride: 2
  feature_dtype: float16
  mask_dtype: uint8
  input_format: manifest
  wds_root: null
  extraction_mode: fixed_grid
  backend: openslide
  cpu_threads: 2
  iterator_cpus: 4
  progress_every: 500
  coords_manifest: null
  official_sampling:
    start_epoch: 0
    epochs: 20
    steps: 250
    sampler_batch_size: 8
    seed: 42
    fast: true
    progress_every: 50
    wsi_cache_size: 4
    prefetch_batches: 2
    mask_cache_size: 65536
    fixed_grid_root: /data3/houjunlin/fxx/datasets/HookNet_TLS_fixed_grid_ps1024
    fixed_grid_patch_weight: uniform
    fixed_grid_min_selected_class_pixels: 1
    fixed_grid_max_resample_attempts: 32
    fixed_grid_sampler_mode: index
