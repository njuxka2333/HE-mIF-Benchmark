experiment:
  id: linear_probe_nucls_gigatime_20x_s32_mif
  head: linear_probe
  dataset: nucls
  model: gigatime
  target_mpp: 0.5
  target_patch_size: 32
  target_features:
  - mif
  use_gap: true
  description: NuCLS gigatime mif GAP only
masks:
  save: false
run:
  feat_dir: Pre_Features/linear_probe_nucls_gigatime_20x_s32/output_layers
  batch_size: 64
  feature_storage: split_h5
  input_format: manifest
  iterator_cpus: 1
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.5
  feature_dtype: float16
  mask_dtype: uint8
  num_workers: 1
