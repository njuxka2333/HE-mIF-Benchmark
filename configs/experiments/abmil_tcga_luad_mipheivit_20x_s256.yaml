experiment:
  id: abmil_tcga_luad_mipheivit_20x_s256
  head: abmil
  dataset: tcga_luad
  model: mipheivit
  target_mpp: 0.5
  target_patch_size: 256
  target_features:
  - z4
  description: abmil on tcga_luad with mipheivit at 20x
masks:
  save: false
run:
  feat_dir: Pre_Features/abmil_tcga_luad_mipheivit_20x_s256/encoder_z4
  feature_storage: patch_h5
  batch_size: 12
  num_workers: 8
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.5
  feature_dtype: float16
  mask_dtype: uint8
