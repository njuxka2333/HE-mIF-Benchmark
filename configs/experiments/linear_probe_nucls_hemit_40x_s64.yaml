experiment:
  id: linear_probe_nucls_hemit_40x_s64
  head: linear_probe
  dataset: nucls
  model: hemit
  target_mpp: 0.25
  target_patch_size: 64
  target_features:
  - resnet_blocks
  use_gap: true
  description: NuCLS Hemit resnet_blocks GAP encoder features
masks:
  save: false
run:
  feat_dir: Pre_Features/linear_probe_nucls_hemit_40x_s64/encoder_resnet_blocks
  batch_size: 64
  feature_storage: split_h5
  input_format: manifest
  iterator_cpus: 1
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.25
  feature_dtype: float16
  mask_dtype: uint8
  num_workers: 1
