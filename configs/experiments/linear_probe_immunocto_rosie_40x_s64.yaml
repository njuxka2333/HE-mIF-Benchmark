experiment:
  id: linear_probe_immunocto_rosie_40x_s64
  head: linear_probe
  dataset: immunocto
  model: rosie
  target_mpp: 0.25
  target_patch_size: 64
  target_features:
  - stage3
  use_gap: true
  description: Linear probe on ImmunOcto with ROSIE stage3 GAP features
masks:
  save: false
run:
  feat_dir: Pre_Features/linear_probe_immunocto_rosie_40x_s64/encoder_stage3
  batch_size: 1
  feature_storage: split_h5
  input_format: webdataset
  wds_root: /data3/houjunlin/fxx/datasets/immunocto_wds
  iterator_cpus: 2
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.25
  feature_dtype: float16
  mask_dtype: uint8
