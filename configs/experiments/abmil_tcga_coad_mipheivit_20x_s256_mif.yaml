experiment:
  id: abmil_tcga_coad_mipheivit_20x_s256_mif
  head: abmil
  dataset: tcga_coad
  model: mipheivit
  target_mpp: 0.5
  target_patch_size: 256
  target_features:
  - mif
  description: abmil on tcga_coad with mipheivit mif virtual-stain bag
masks:
  save: false
run:
  feat_dir: Pre_Features/abmil_tcga_coad_mipheivit_20x_s256/output_layers
  feature_storage: patch_h5
  batch_size: 12
  num_workers: 8
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.5
  feature_dtype: float16
  mask_dtype: uint8
