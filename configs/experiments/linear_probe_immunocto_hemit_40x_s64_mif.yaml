experiment:
  id: linear_probe_immunocto_hemit_40x_s64_mif
  head: linear_probe
  dataset: immunocto
  model: hemit
  target_mpp: 0.25
  target_patch_size: 64
  target_features:
  - mif
  use_gap: true
  description: Immunocto hemit virtual-stain linear probe
masks:
  save: false
run:
  feat_dir: Pre_Features/linear_probe_immunocto_hemit_40x_s64/output_layers
  batch_size: 64
  feature_storage: split_h5
  input_format: manifest
  iterator_cpus: 1
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.25
  feature_dtype: float16
  mask_dtype: uint8
  num_workers: 1
