experiment:
  id: linear_probe_nucls_hoptimus0_20x_s32
  head: linear_probe
  dataset: nucls
  model: mipheivit
  target_mpp: 0.5
  target_patch_size: 32
  target_features:
  - z4
  use_gap: true
  description: Frozen H-optimus-0 (MIPHEI-ViT encoder route, LoRA off)
masks:
  save: false
extract:
  layers: encoder
  env:
    MIPHEI_USE_LORA: "0"
    MIPHEI_SKIP_GENERATOR_CKPT: "1"
    MIPHEI_ENCODER_NAME: hoptimus0
    MIPHEI_IMG_SIZE: "256"
run:
  feat_dir: Pre_Features/linear_probe_nucls_hoptimus0_20x_s32/encoder_z4
  batch_size: 64
  feature_storage: split_h5
  input_format: manifest
  iterator_cpus: 1
  use_benchmark_config: true
  benchmark_config_path: configs/benchmark_models.yaml
  fallback_mpp: 0.5
  feature_dtype: float16
  mask_dtype: uint8
  num_workers: 1
